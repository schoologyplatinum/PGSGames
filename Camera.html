dth%3D%221.6%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%2236.5%22%20cy%3D%2239.5%22%20r%3D%221.1%22%20fill%3D%22%239db4ff%22%20fill-opacity%3D%22.6%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2224.5%22%20r%3D%222%22%20fill%3D%22%23f5f5f7%22/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--pn:#131316;--ln:#26262c;--tx:#f4f4f5;--mu:#8d8d98;--am:#ffb020;--rd:#ff3b30;--r:16px}
*{box-sizing:border-box;margin:0;font-family:Sora,system-ui,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
button{cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#app{height:100%;display:grid;grid-template-columns:var(--dw,300px) 1fr 132px;grid-template-rows:60px 1fr;gap:0 14px;padding:0 14px 14px;transition:grid-template-columns .25s}
#app.nodrawer{--dw:0px}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;letter-spacing:.14em;font-size:13px;display:flex;align-items:center;gap:9px}
.brand svg{width:40px;height:40px;filter:drop-shadow(0 4px 14px #0009);transition:transform .25s}.brand:hover svg{transform:scale(1.07)}
.sp{flex:1}
.pill{height:38px;padding:0 14px;border-radius:19px;background:var(--pn);border:1px solid var(--ln);display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);transition:.15s}
.pill:hover{color:var(--tx);border-color:#3a3a42}.pill.on{color:#000;background:var(--am);border-color:var(--am)}
#fname{color:var(--tx);font-weight:600}
aside{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
#app.nodrawer aside{visibility:hidden;border:0}
.sr{padding:12px 12px 6px}
#fq{width:100%;height:40px;border-radius:12px;border:1px solid var(--ln);background:#0c0c0e;color:var(--tx);padding:0 14px;font-size:13px;outline:0}#fq:focus{border-color:var(--am)}
.cats{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;flex:none}
.cat{padding:7px 13px;border-radius:15px;font-size:12px;color:var(--mu);border:1px solid var(--ln);white-space:nowrap}.cat.on{background:var(--tx);color:#000;border-color:var(--tx)}
#fl{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 12px 14px;align-content:start;scrollbar-width:thin;scrollbar-color:#333 transparent}
.fc{aspect-ratio:1;border-radius:14px;background:#1b1b1f;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:.12s}
.fc:hover{background:#25252b}.fc.on{border-color:var(--am);background:#2a2214}
.fc i{font-style:normal;font-size:26px}.fc small{font-size:10.5px;color:var(--mu)}.fc.on small{color:var(--am)}
.none{grid-column:1/-1;color:var(--mu);font-size:13px;text-align:center;padding:30px 0}
main{position:relative;border-radius:var(--r);overflow:hidden;background:#000;border:1px solid var(--ln);min-height:0}
#ccv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#cvid{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#gr{position:absolute;inset:0;pointer-events:none;display:none;background:linear-gradient(90deg,transparent calc(33.3% - .5px),#fff4 calc(33.3% - .5px),#fff4 calc(33.3% + .5px),transparent calc(33.3% + .5px),transparent calc(66.6% - .5px),#fff4 calc(66.6% - .5px),#fff4 calc(66.6% + .5px),transparent calc(66.6% + .5px)),linear-gradient(0deg,transparent calc(33.3% - .5px),#fff4 calc(33.3% - .5px),#fff4 calc(33.3% + .5px),transparent calc(33.3% + .5px),transparent calc(66.6% - .5px),#fff4 calc(66.6% - .5px),#fff4 calc(66.6% + .5px),transparent calc(66.6% + .5px))}
#fx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:150px;font-weight:700;text-shadow:0 4px 40px #000a;pointer-events:none}
#rc{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:9px;background:#000a;backdrop-filter:blur(8px);padding:8px 16px;border-radius:20px;font:500 14px 'JetBrains Mono',monospace}
#rc:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--rd);animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
body.rec #rc{display:flex}
#st{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#000b;backdrop-filter:blur(8px);padding:8px 16px;border-radius:18px;font-size:12.5px;display:none;max-width:90%;text-align:center}
nav{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 0 4px}
#thumb{width:76px;height:76px;border-radius:18px;background:var(--pn) center/cover;border:2px solid var(--ln);overflow:hidden;transition:.15s;color:var(--mu);display:flex;align-items:center;justify-content:center}
#thumb:hover{border-color:var(--am);transform:scale(1.04)}
#thumb video,#thumb img{width:100%;height:100%;object-fit:cover}
.seg{display:flex;flex-direction:column;background:var(--pn);border:1px solid var(--ln);border-radius:22px;padding:4px;gap:2px}
.seg button{padding:9px 16px;border-radius:18px;font-size:12px;font-weight:600;color:var(--mu)}.seg button.on{background:var(--tx);color:#000}
#shut{width:92px;height:92px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;transition:.15s}
#shut:hover{transform:scale(1.05)}#shut:active{transform:scale(.94)}
#shut:after{content:"";width:68px;height:68px;border-radius:50%;background:#fff;transition:.2s}
body.vid #shut:after{background:var(--rd)}body.rec #shut:after{width:34px;height:34px;border-radius:9px;background:var(--rd)}
.rb{width:48px;height:48px;border-radius:50%;background:var(--pn);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;color:var(--mu);transition:.15s}.rb:hover{color:var(--tx);border-color:#3a3a42}
#gal{position:fixed;inset:0;background:#09090bf2;backdrop-filter:blur(14px);z-index:20;display:none;flex-direction:column}
#gal.open{display:flex}
.gh{height:64px;display:flex;align-items:center;gap:12px;padding:0 20px;flex:none}
.gh h2{font-size:15px;letter-spacing:.1em;flex:1}
#gg{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:6px 20px 24px;align-content:start}
.gi{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#1b1b1f;transition:.15s}.gi:hover{transform:scale(1.02);outline:2px solid var(--am)}
.gi img,.gi video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.gi span{position:absolute;right:8px;bottom:8px;background:#000b;border-radius:10px;padding:3px 9px;font:500 11px 'JetBrains Mono',monospace}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:90px 0;font-size:14px}
#vw{flex:1;display:none;flex-direction:column;min-height:0}
#gal.view #vw{display:flex}#gal.view #gg{display:none}
#vm{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 70px;position:relative}
#vm img,#vm video{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 80px #000}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px}.ar.l{left:14px}.ar.r{right:14px}
#va{display:flex;justify-content:center;gap:10px;padding:16px;flex-wrap:wrap;flex:none}
#va .pill{color:var(--tx)}#va .pill:hover{border-color:var(--am)}#va .pill.dng:hover{border-color:var(--rd);color:var(--rd)}
#vi{text-align:center;color:var(--mu);font-size:12px;padding-bottom:4px}
#tt{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tx);color:#000;padding:11px 20px;border-radius:22px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
#tt.on{opacity:1;transform:translateX(-50%)}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:56px 1fr auto;padding:0 8px 8px;gap:8px 0}
 aside{position:fixed;left:8px;right:8px;bottom:8px;height:46vh;z-index:10;box-shadow:0 0 60px #000}#app.nodrawer aside{display:none}
 nav{flex-direction:row;padding:0}.seg{flex-direction:row}#shut{width:76px;height:76px}#shut:after{width:56px;height:56px}#thumb{width:58px;height:58px}#vm{padding:0 8px}.ar{display:none}.fb{display:none}}
</style></head><body>

<aside><div class="sr"><input id="fq" type="search" placeholder="Search filters — cat, party, glitch…" autocomplete="off"></div><div class="cats" id="cats"></div><div id="fl"></div></aside>

</div>

const count=n=>new Promise(r=>{const c=$('#cd');c.style.display='flex';let i=n;const t=()=>{if(i<=0){c.style.display='none';return r()}c.textContent=i--;setTimeout(t,1000)};t()});
async function save(o){o.id=Date.now()+'-'+Math.random().toString(36).slice(2,6);o.ts=Date.now();o.url=URL.createObjectURL(o.blob);items.unshift(o);thumb();
 try{await dbx('readwrite',s=>s.put({id:o.id,type:o.type,blob:o.blob,ts:o.ts,mime:o.mime,dur:o.dur}))}catch(e){}
 toast(o.type=='photo'?'Photo saved to gallery':'Video saved to gallery')}
async function shutter(){if(busy)return;const c=$('#ccv');if(!c.width)return toast('Camera is not ready yet');
 if(rec){rec.stop();return}
 if(tsec){busy=1;await count(tsec);busy=0}
 if(mode=='photo'){flash();$('#ccv').toBlob(b=>save({type:'photo',blob:b,mime:'image/jpeg'}),'image/jpeg',.93)}else startRec()}
async function startRec(){const c=$('#ccv'),out=c.captureStream(30);
 try{recMic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});recMic.getAudioTracks().forEach(t=>out.addTrack(t))}catch(e){toast('Recording without sound (microphone blocked)')}
 const mt=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t)),ch=[];
 rec=new MediaRecorder(out,{mimeType:mt,videoBitsPerSecond:8e6});rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
 rec.onstop=()=>{clearInterval(recI);const d=(Date.now()-recT)/1000,m=rec.mimeType;rec=null;document.body.classList.remove('rec');recMic&&recMic.getTracks().forEach(t=>t.stop());save({type:'video',blob:new Blob(ch,{type:m}),mime:m,dur:d})};
 rec.start(500);recT=Date.now();document.body.classList.add('rec');$('#rc').textContent='00:00';recI=setInterval(()=>$('#rc').textContent=fmt((Date.now()-recT)/1000),250)}
function setMode(m){if(rec)return;mode=m;document.body.classList.toggle('vid',m=='video');$('#mp').classList.toggle('on',m=='photo');$('#mv').classList.toggle('on',m=='video')}
$('#mp').onclick=()=>setMode('photo');$('#mv').onclick=()=>setMode('video');$('#shut').onclick=shutter;
$('#flip').onclick=()=>{if(rec)return;camFacing=camFacing=='user'?'environment':'user';startCam()};
$('#bf').onclick=()=>{const a=$('#app');a.classList.toggle('nodrawer');$('#bf').classList.toggle('on',!a.classList.contains('nodrawer'))};
$('#bt').onclick=()=>{tsec=tsec==0?3:tsec==3?10:0;$('#btl').textContent=tsec?tsec+'s':'Off';$('#bt').classList.toggle('on',!!tsec)};
$('#bg').onclick=()=>{const g=$('#gr');g.style.display=g.style.display=='block'?'none':'block';$('#bg').classList.toggle('on',g.style.display=='block')};
$('#bz').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
/* gallery */
const nm=it=>'camera-'+new Date(it.ts).toISOString().slice(0,19).replace(/[-:]/g,'').replace('T','-')+(it.type=='photo'?'.jpg':/mp4/.test(it.mime)?'.mp4':'.webm');
function thumb(){const t=$('#thumb'),it=items[0];if(!it)return;t.innerHTML=it.type=='photo'?`<img src="${it.url}">`:`<video src="${it.url}#t=0.1" muted preload="metadata"></video>`}
function grid(){$('#gal').classList.remove('view');$('#gt').textContent='GALLERY · '+items.length;$('#gbl').textContent='Camera';
 $('#gg').innerHTML=items.length?items.map((it,i)=>`<button class="gi" data-i="${i}">${it.type=='photo'?`<img src="${it.url}">`:`<video src="${it.url}#t=0.1" muted preload="metadata"></video><span>▶ ${fmt(it.dur||0)}</span>`}</button>`).join(''):'<div class="empty">Nothing here yet — take a photo or video and it will appear here.</div>'}
function show(i){if(i<0||i>=items.length)return;view=i;const it=items[i],g=$('#gal');g.classList.add('view');$('#gbl').textContent='Gallery';$('#gt').textContent=(i+1)+' / '+items.length;
 $('#vc').innerHTML=it.type=='photo'?`<img src="${it.url}">`:`<video id="pvv" src="${it.url}" controls autoplay></video>`;
 const v=$('#pvv');if(v)v.onloadedmetadata=()=>{if(v.duration===Infinity){v.currentTime=1e7;v.ontimeupdate=()=>{v.ontimeupdate=null;v.currentTime=0}}};
 $('#vi').textContent=new Date(it.ts).toLocaleString()+' · '+(it.blob.size/1048576).toFixed(1)+' MB';
 const can=it.type=='photo'?1:0,sh=navigator.canShare&&navigator.canShare({files:[new File([it.blob],nm(it),{type:it.mime})]});
 $('#va').innerHTML=`<button class="pill" data-a="dl">${IC(ICN.dl)}Download</button>${can?`<button class="pill" data-a="cp">${IC(ICN.cp)}Copy</button>`:''}<button class="pill" data-a="ml">${IC(ICN.ml)}Gmail</button>${sh?`<button class="pill" data-a="sh">${IC(ICN.sh)}Share</button>`:''}<button class="pill dng" data-a="rm">${IC(ICN.tr)}Delete</button>`}
function dl(it){const a=document.createElement('a');a.href=it.url;a.download=nm(it);document.body.append(a);a.click();a.remove()}
async function cpy(it){try{const b=await createImageBitmap(it.blob),c=document.createElement('canvas');c.width=b.width;c.height=b.height;c.getContext('2d').drawImage(b,0,0);
 const png=await new Promise(r=>c.toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);return 1}catch(e){return 0}}
$('#va').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const it=items[view],a=b.dataset.a;
 if(a=='dl'){dl(it);toast('Download started')}
 else if(a=='cp')toast(await cpy(it)?'Photo copied — paste it anywhere':'Copy was blocked by the browser — use Download instead');
 else if(a=='ml'){let ok=it.type=='photo'&&await cpy(it);if(!ok)dl(it);
  window.open('https://mail.google.com/mail/?view=cm&fs=1&su='+encodeURIComponent('My '+(it.type=='photo'?'photo':'video')+' from my camera'),'_blank');
  toast(ok?'Gmail opened — press Ctrl+V in the email to paste the photo':'Gmail opened — attach the file that just downloaded')}
 else if(a=='sh'){try{await navigator.share({files:[new File([it.blob],nm(it),{type:it.mime})]})}catch(e){}}
 else if(a=='rm'){if(!confirm('Delete this '+it.type+'?'))return;try{await dbx('readwrite',s=>s.delete(it.id))}catch(e){}URL.revokeObjectURL(it.url);items.splice(view,1);
  if(!items.length){grid();thumbReset()}else{thumb();show(Math.min(view,items.length-1))}toast('Deleted')}};
const thumbReset=()=>$('#thumb').innerHTML=IC('<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>');
const openGal=()=>{if(rec)return;grid();$('#gal').classList.add('open')},closeGal=()=>{$('#gal').classList.remove('open');$('#vc').innerHTML=''};
$('#thumb').onclick=openGal;$('#gg').onclick=e=>{const b=e.target.closest('[data-i]');if(b)show(+b.dataset.i)};
$('#gb').onclick=()=>$('#gal').classList.contains('view')?(grid(),$('#vc').innerHTML=''):closeGal();
$('#pv').onclick=()=>show(view-1);$('#nx').onclick=()=>show(view+1);
document.onkeydown=e=>{if(e.target.tagName=='INPUT'||e.ctrlKey||e.metaKey)return;const k=e.key.toLowerCase(),g=$('#gal').classList.contains('open'),v=$('#gal').classList.contains('view');
 if(g){if(k=='escape')$('#gb').click();else if(v&&k=='arrowleft')show(view-1);else if(v&&k=='arrowright')show(view+1);return}
 if(k==' '||k=='enter'){e.preventDefault();shutter()}else if(k=='g')e.shiftKey?openGal():$('#bg').click();else if(k=='f')$('#bf').click();else if(k=='c')$('#flip').click();else if(k=='t')$('#bt').click();else if(k=='1')setMode('photo');else if(k=='2')setMode('video')};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!camStream&&!rec)startCam()});
(async()=>{renderFl();if(innerWidth>820){$('#app').classList.remove('nodrawer');$('#bf').classList.add('on')}
 try{const all=await dbx('readonly',s=>s.getAll());items=all.sort((a,b)=>b.ts-a.ts).map(o=>({...o,url:URL.createObjectURL(o.blob)}));thumb()}catch(e){}
 startCam()})();
</script></body></html>

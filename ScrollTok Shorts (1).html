<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScrollTok Shorts</title>
<style>
:root{--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.7);--red:#fe2c55;--cyan:#25f4ee;--sheet:#161823;--line:rgba(255,255,255,.12);color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0a0a;color:var(--fg);font-family:"Proxima Nova",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.app{position:relative;width:100%;height:100%;max-width:440px;background:var(--bg);overflow:hidden}
@media(min-width:600px){.app{height:min(100%,900px);border-radius:18px}}
.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.vid{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;cursor:pointer;user-select:none}
.scene{position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),var(--c2),var(--c3));background-size:300% 300%;animation:drift 9s ease-in-out infinite}
.scene .big{position:absolute;left:50%;top:38%;font-size:128px;transform:translate(-50%,-50%);animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 12px 24px rgba(0,0,0,.35))}
.scene .p{position:absolute;font-size:30px;opacity:.7;animation:float 6s linear infinite}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.65))}
@keyframes drift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes bob{0%,100%{transform:translate(-50%,-50%) rotate(-6deg) scale(1)}50%{transform:translate(-50%,-56%) rotate(6deg) scale(1.08)}}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-110vh)}}
.vid.paused .scene,.vid.paused .scene *{animation-play-state:paused}
.vid:not(.active) .scene,.vid:not(.active) .scene *{animation-play-state:paused}
.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;gap:20px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;font-weight:700;font-size:17px;pointer-events:none}
.top button{pointer-events:auto;background:none;border:0;color:var(--dim);font:inherit;padding:4px 2px;cursor:pointer;position:relative}
.top button.on{color:var(--fg)}
.top button.on::after{content:"";position:absolute;left:25%;right:25%;bottom:-3px;height:3px;background:var(--fg);border-radius:2px}
.top .search{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px)}
.rail{position:absolute;right:10px;bottom:84px;z-index:4;display:flex;flex-direction:column;align-items:center;gap:16px}
.rail button{background:none;border:0;color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12px inherit;font-family:inherit;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.rail svg{width:34px;height:34px;fill:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45));transition:transform .15s}
.rail button:active svg{transform:scale(.85)}
.rail .liked svg{fill:var(--red);animation:pop .3s}
.rail .saved svg{fill:#ffc83d}
@keyframes pop{50%{transform:scale(1.3)}}
.avatar{position:relative;width:48px;height:48px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:24px;margin-bottom:10px}
.avatar .plus{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:15px;line-height:20px;text-align:center;font-weight:700}
.avatar .plus.done{background:#fff;color:var(--red)}
.disc{width:44px;height:44px;border-radius:50%;background:conic-gradient(#222,#555,#222,#555,#222);border:8px solid #1c1c1c;display:grid;place-items:center;font-size:13px;animation:spin 5s linear infinite}
.vid:not(.active) .disc,.vid.paused .disc{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.info{position:absolute;left:12px;right:84px;bottom:76px;z-index:4;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.info .u{font-weight:700;font-size:17px;margin-bottom:6px}
.info .cap{font-size:15px;line-height:1.35;margin-bottom:8px}
.info .cap b{font-weight:700}
.info .snd{font-size:14px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.bar{position:absolute;left:0;right:0;bottom:56px;height:2px;background:rgba(255,255,255,.25);z-index:6}
.bar i{display:block;height:100%;width:0;background:#fff;animation:prog 14s linear infinite;animation-play-state:paused}
.vid.active:not(.paused) .bar i{animation-play-state:running}
@keyframes prog{to{width:100%}}
.nav{position:absolute;left:0;right:0;bottom:0;z-index:8;height:calc(56px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:#000;display:flex;align-items:center;justify-content:space-around;border-top:1px solid var(--line)}
.nav button{background:none;border:0;color:var(--dim);font:600 10px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:56px}
.nav button.on{color:#fff}
.nav svg{width:24px;height:24px;fill:currentColor}
.nav .add{width:46px;height:30px;border-radius:9px;background:#fff;position:relative;border:0;padding:0;min-width:46px}
.nav .add::before,.nav .add::after{content:"";position:absolute;inset:0;border-radius:9px;z-index:-1}
.nav .add::before{background:var(--cyan);transform:translateX(-3px)}
.nav .add::after{background:var(--red);transform:translateX(3px)}
.nav .add span{font-size:22px;color:#000;font-weight:700;line-height:30px}
.flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);font-size:72px;opacity:0;z-index:3;pointer-events:none;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.9;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
.burst{position:absolute;z-index:7;font-size:90px;pointer-events:none;transform:translate(-50%,-50%);animation:bu .8s ease-out forwards}
@keyframes bu{0%{opacity:1;transform:translate(-50%,-50%) scale(.3) rotate(-15deg)}30%{transform:translate(-50%,-60%) scale(1.1) rotate(8deg)}100%{opacity:0;transform:translate(-50%,-140%) scale(1.2)}}
.sheet{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:20;background:var(--sheet);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.scrim{position:absolute;inset:0;z-index:19;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sh{display:flex;justify-content:center;align-items:center;padding:14px;font-weight:700;font-size:14px;position:relative;border-bottom:1px solid var(--line)}
.sh button{position:absolute;right:12px;top:8px;background:none;border:0;color:var(--dim);font-size:24px;cursor:pointer}
.list{flex:1;overflow-y:auto;padding:8px 16px}
.cm{display:flex;gap:12px;padding:10px 0;font-size:14px;line-height:1.35}
.cm .a{width:36px;height:36px;border-radius:50%;background:#333;display:grid;place-items:center;flex:none;font-size:18px}
.cm .n{color:var(--dim);font-size:13px;font-weight:600;margin-bottom:2px}
.cm .t{color:var(--dim);font-size:12px;margin-top:4px}
.empty{color:var(--dim);text-align:center;padding:40px 0;font-size:14px}
.cin{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.cin input{flex:1;background:#2a2c3a;border:0;border-radius:20px;padding:11px 16px;color:#fff;font:inherit;font-size:14px;outline:none}
.cin input:focus-visible{outline:2px solid var(--cyan)}
.cin button{background:none;border:0;color:var(--red);font:700 14px inherit;font-family:inherit;cursor:pointer;padding:0 6px}
.toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-20px);background:rgba(40,40,40,.95);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){.scene,.scene *{animation:none!important}}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:1;background:#000}
.tap{position:absolute;inset:0;z-index:2}
.top .search{font-size:20px;line-height:1}
.set{height:82%}
.f{display:flex;flex-direction:column;gap:6px;padding:8px 0;font-size:13px;color:var(--dim)}
.f input,.f textarea{background:#2a2c3a;border:0;border-radius:10px;padding:11px 14px;color:#fff;font:inherit;font-size:14px;outline:none;resize:none}
.f input:focus-visible,.f textarea:focus-visible{outline:2px solid var(--cyan)}
.go{width:100%;margin:10px 0;padding:12px;border:0;border-radius:8px;background:var(--red);color:#fff;font:700 15px inherit;font-family:inherit;cursor:pointer}
.note{font-size:12px;line-height:1.4;color:var(--dim);margin:6px 0}
#stat{color:var(--cyan)}
.err{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;background:rgba(0,0,0,.85);font-size:15px;line-height:1.4;pointer-events:none}
.err a{pointer-events:auto;background:var(--red);color:#fff;padding:10px 18px;border-radius:8px;font-weight:700;text-decoration:none}
.info .snd a{text-decoration:none}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <button id="tFol">Following</button><button id="tFyp" class="on">For You</button>
    <button class="search" id="gear" aria-label="Feed settings">⚙️</button><button class="search" id="mute" aria-label="Toggle sound" style="right:auto;left:14px">🔇</button>
  </div>
  <div class="feed" id="feed"></div>
  <div class="nav">
    <button class="on"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>Home</button>
    <button><svg viewBox="0 0 24 24"><path d="M8 11a3 3 0 100-6 3 3 0 000 6zm8 0a3 3 0 100-6 3 3 0 000 6zM8 13c-2.7 0-6 1.3-6 4v2h12v-2c0-2.7-3.3-4-6-4zm8 0c-.4 0-.8 0-1.2.1 1.3.9 2.2 2.2 2.2 3.9v2h5v-2c0-2.7-3.3-4-6-4z"/></svg>Friends</button>
    <button class="add" aria-label="Create"><span>+</span></button>
    <button><svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4zm4 4v2h8V8z"/></svg>Inbox</button>
    <button><svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 100-9 4.5 4.5 0 000 9zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg>Profile</button>
  </div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Comments">
    <div class="sh"><span id="shT">Comments</span><button id="shX" aria-label="Close">×</button></div>
    <div class="list" id="list"></div>
    <div class="cin"><input id="cinp" placeholder="Add a comment…" maxlength="150"><button id="post">Post</button></div>
  </div>
  <div class="sheet set" id="set" role="dialog" aria-label="Feed settings">
    <div class="sh"><span>Feed settings</span><button id="setX" aria-label="Close">×</button></div>
    <div class="list">
      <label class="f">YouTube Data API key<input id="fk" type="password" autocomplete="off" placeholder="Paste your key"></label>
      <label class="f">Search topic<input id="fq" placeholder="funny animals"></label>
      <label class="f">Or paste Shorts links or video IDs<textarea id="fl" rows="3" placeholder="https://youtube.com/shorts/…"></textarea></label>
      <button class="go" id="fgo">Load videos</button>
      <p class="note" id="stat"></p>
      <p class="note">Likes, saves and comments you post stay in this page only. Your key is saved in this browser and sent only to Google.</p>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
const DEMO=[
 {u:"@bakewithmaya",e:"🧁",c:["#ff7eb3","#ff758c","#7b2ff7"],cap:"Three-ingredient cupcakes that actually rise",tags:"#baking #easyrecipes",snd:"Sugar Rush – Original sound",l:482100,m:3204,s:12900,p:["🍓","🧈","✨"]},
 {u:"@skatejoe",e:"🛹",c:["#0f2027","#2c5364","#25f4ee"],cap:"Landed it on try 47. Do not look at try 46",tags:"#skate #nevergiveup",snd:"Kickflip Beat – DJ Wheelz",l:91300,m:812,s:2210,p:["💨","⚡","🔥"]},
 {u:"@pupdates",e:"🐶",c:["#f6d365","#fda085","#f857a6"],cap:"He knows the word “treat” in four languages now",tags:"#dogsoftiktok #goldenretriever",snd:"Good Boy Boogie – pupdates",l:1203000,m:20400,s:88000,p:["🦴","🐾","💛"]},
 {u:"@nightowlcode",e:"💻",c:["#0b0b2b","#1e3c72","#6a11cb"],cap:"One CSS line that fixed my entire layout",tags:"#coding #webdev #css",snd:"lofi study loop – nightowl",l:57800,m:1490,s:9100,p:["{ }","</>","☕"]},
 {u:"@trailtales",e:"🏔️",c:["#134e5e","#71b280","#f7e8a4"],cap:"Sunrise at 12,000 ft was worth the 4 a.m. alarm",tags:"#hiking #outdoors",snd:"Ambient Peaks – Original sound",l:239400,m:2870,s:15300,p:["🌲","☁️","🦅"]},
 {u:"@chefkenji",e:"🍜",c:["#8e2de2","#d4145a","#fbb03b"],cap:"Ramen broth in 20 minutes. Yes, really",tags:"#ramen #quickdinner",snd:"Slurp Season – Chef Kenji",l:664000,m:7120,s:41000,p:["🌶️","🥚","🔥"]}
];
const NAMES=["lena.k","marcus_t","jojo","priya.s","tomasz","dani_rae","ollie"];
const TXT=["Okay this is genuinely so good","Saving this for later","Not me watching this 6 times","The ending 😂","Tutorial please!!","This deserves way more views","Sent to my whole group chat"];
const AV=["😎","🦊","🌸","🎧","🐱","🌮","⭐"];
const fmt=n=>n>=1e6?(n/1e6).toFixed(1).replace(".0","")+"M":n>=1e3?(n/1e3).toFixed(1).replace(".0","")+"K":""+n;
const I={heart:"M12 21s-8-5.4-8-11.2C4 6.6 6.4 4.5 9 4.5c1.4 0 2.6.7 3 1.8.4-1.1 1.6-1.8 3-1.8 2.6 0 5 2.1 5 5.3C20 15.6 12 21 12 21z",cm:"M4 3h16a1 1 0 011 1v13a1 1 0 01-1 1H9l-5 4V4a1 1 0 011-1zm4 6v2h8V9z",bm:"M6 3h12a1 1 0 011 1v17l-7-5-7 5V4a1 1 0 011-1z",sh:"M14 3l8 8-8 8v-5c-5 0-8 1.5-10 5 .5-6 4-10 10-11z"};
const ic=p=>`<svg viewBox="0 0 24 24"><path d="${p}"/></svg>`;
const PAL=[["#ff7eb3","#ff758c","#7b2ff7"],["#0f2027","#2c5364","#25f4ee"],["#f6d365","#fda085","#f857a6"],["#0b0b2b","#1e3c72","#6a11cb"],["#134e5e","#71b280","#f7e8a4"],["#8e2de2","#d4145a","#fbb03b"]];
const $=id=>document.getElementById(id),feed=$("feed"),scrim=$("scrim"),list=$("list"),cinp=$("cinp");
let items=[],st=[],muted=true,cur=0,next="",lastTap=0,ci=0,busy=false;
let cfg={key:"",q:"funny animals",links:""};
try{Object.assign(cfg,JSON.parse(localStorage.getItem("scrolltok")||"{}"))}catch(_){}
const mkSt=(v,i)=>({liked:false,saved:false,follow:false,l:v.l,m:v.m,s:v.s||0,cm:v.id?null:TXT.slice(0,3+i%3).map((t,j)=>({n:NAMES[(i+j)%7],t,a:AV[(i+j)%7],w:(j+1)+"h"}))});
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),1800)};
const setStat=m=>{$("stat").textContent=m};
function slide(v,i){
 const d=document.createElement("section");d.className="vid";d.dataset.i=i;
 d.style.cssText=`--c1:${v.c[0]};--c2:${v.c[1]};--c3:${v.c[2]}`;
 let ps="";(v.p||[]).forEach((x,k)=>{ps+=`<span class="p" style="left:${12+k*30}%;top:${70+k*12}%;animation-delay:${-k*2}s">${x}</span>`});
 d.innerHTML=`<div class="scene"><span class="big">${v.e}</span>${ps}</div><div class="tap"></div><div class="flash">▶</div>
 <div class="info"><div class="u"></div><div class="cap"></div><div class="snd"></div></div>
 <div class="rail">
  <div class="avatar" style="background:${v.c[1]}">${v.e}<span class="plus" data-a="follow">+</span></div>
  <button data-a="like">${ic(I.heart)}<span class="nl"></span></button>
  <button data-a="cm">${ic(I.cm)}<span class="nm"></span></button>
  <button data-a="save">${ic(I.bm)}<span class="ns"></span></button>
  <button data-a="share">${ic(I.sh)}<span class="nh"></span></button>
  <div class="disc">♪</div>
 </div>`;
 d.querySelector(".u").textContent=v.u;
 const cap=d.querySelector(".cap");cap.textContent=v.cap;
 if(v.tags){const b=document.createElement("b");b.textContent=" "+v.tags;cap.append(b)}
 const sn=d.querySelector(".snd");
 if(v.id){const a=document.createElement("a");a.href="https://www.youtube.com/shorts/"+v.id;a.target="_blank";a.rel="noopener";a.textContent="▶ Watch on YouTube ↗";a.style.color="#fff";sn.append(a)}else sn.textContent="♫ "+v.snd;
 return d;
}
function paint(i){
 const d=feed.children[i],s=st[i];
 d.querySelector("[data-a=like]").classList.toggle("liked",s.liked);
 d.querySelector(".nl").textContent=fmt(s.l);
 d.querySelector(".nm").textContent=fmt(s.m);
 d.querySelector(".ns").textContent=s.saved?"Saved":"Save";
 d.querySelector("[data-a=save]").classList.toggle("saved",s.saved);
 d.querySelector(".nh").textContent=s.s?fmt(s.s):"Share";
 const p=d.querySelector(".plus");p.textContent=s.follow?"✓":"+";p.classList.toggle("done",s.follow);
}
function add(arr){arr.forEach(v=>{const i=items.length;items.push(v);st.push(mkSt(v,i));const d=slide(v,i);feed.appendChild(d);paint(i);io.observe(d)});
 if(feed.children[0]&&!feed.querySelector(".active")){feed.children[0].classList.add("active");mount(feed.children[0])}}
const cmd=fn=>{const f=feed.querySelector(".vid.active iframe");if(f&&f.contentWindow)f.contentWindow.postMessage(JSON.stringify({event:"command",func:fn,args:[]}),"*")};
function mount(d){
 feed.querySelectorAll("iframe").forEach(f=>f.remove());
 const v=items[+d.dataset.i];if(!v||!v.id)return;
 const f=document.createElement("iframe");
 f.src=`https://www.youtube.com/embed/${v.id}?autoplay=1&mute=${muted?1:0}&controls=0&loop=1&playlist=${v.id}&playsinline=1&rel=0&modestbranding=1&enablejsapi=1`;
 f.allow="autoplay; encrypted-media; picture-in-picture";f.referrerPolicy="strict-origin-when-cross-origin";f.title=v.cap;f.onload=()=>{try{f.contentWindow.postMessage(JSON.stringify({event:"listening",id:1,channel:"widget"}),"*")}catch(_){}};
 d.insertBefore(f,d.querySelector(".tap"));
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){cur=+e.target.dataset.i;[...feed.children].forEach(c=>c.classList.remove("active","paused"));e.target.classList.add("active");mount(e.target);if(next&&cur>=items.length-2)load(true)}}),{root:feed,threshold:.6});
function like(i,on){const s=st[i];if(on===true&&s.liked)return;s.liked=on===undefined?!s.liked:on;s.l+=s.liked?1:-1;paint(i)}
feed.addEventListener("click",e=>{
 const v=e.target.closest(".vid");if(!v||e.target.closest("a"))return;const i=+v.dataset.i;
 const a=e.target.closest("[data-a]");
 if(a){const k=a.dataset.a;
  if(k==="like")like(i);
  else if(k==="follow"){st[i].follow=!st[i].follow;paint(i);toast(st[i].follow?"Following "+items[i].u:"Unfollowed")}
  else if(k==="save"){st[i].saved=!st[i].saved;paint(i);toast(st[i].saved?"Added to favorites":"Removed from favorites")}
  else if(k==="share"){st[i].s++;paint(i);toast("Link copied");try{navigator.clipboard&&navigator.clipboard.writeText(items[i].id?"https://www.youtube.com/shorts/"+items[i].id:location.href)}catch(_){}}
  else if(k==="cm")openC(i);
  return}
 const now=Date.now(),r=v.getBoundingClientRect();
 if(now-lastTap<300){const b=document.createElement("div");b.className="burst";b.textContent="❤️";b.style.left=(e.clientX-r.left)+"px";b.style.top=(e.clientY-r.top)+"px";v.appendChild(b);setTimeout(()=>b.remove(),850);like(i,true);lastTap=0;return}
 lastTap=now;
 setTimeout(()=>{if(lastTap===now){const p=v.classList.toggle("paused");cmd(p?"pauseVideo":"playVideo");const f=v.querySelector(".flash");f.textContent=p?"❚❚":"▶";f.classList.remove("go");void f.offsetWidth;f.classList.add("go")}},310);
});
window.addEventListener("message",e=>{
 if(typeof e.data!=="string"||!/youtube/.test(e.origin))return;
 let d;try{d=JSON.parse(e.data)}catch(_){return}
 if(d.event!=="onError")return;
 const v=feed.querySelector(".vid.active");if(!v||v.querySelector(".err"))return;
 const x=document.createElement("div");x.className="err";
 x.innerHTML='<p></p><a target="_blank" rel="noopener">Watch on YouTube ↗</a>';
 x.querySelector("p").textContent="YouTube blocked playback here (error "+d.info+"). Videos usually play once this page is served from a normal web address, not a sandbox or a local file.";
 x.querySelector("a").href="https://www.youtube.com/shorts/"+items[+v.dataset.i].id;
 v.appendChild(x);
});
const closeS=()=>{document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("open"));scrim.classList.remove("open")};
const openS=id=>{$(id).classList.add("open");scrim.classList.add("open")};
function renderC(){
 const c=st[ci].cm||[];$("shT").textContent=fmt(st[ci].m)+" comments";
 list.innerHTML=st[ci].cm===null?'<div class="empty">Loading comments…</div>':c.length?c.map(()=>`<div class="cm"><div class="a"></div><div><div class="n"></div><div class="x"></div><div class="t"></div></div></div>`).join(""):'<div class="empty">No comments to show yet.</div>';
 [...list.querySelectorAll(".cm")].forEach((el,k)=>{el.querySelector(".a").textContent=c[k].a;el.querySelector(".n").textContent=c[k].n;el.querySelector(".x").textContent=c[k].t;el.querySelector(".t").textContent=c[k].w});
}
async function openC(i){
 ci=i;renderC();openS("sheet");
 const v=items[i];
 if(v.id&&st[i].cm===null){
  try{if(!cfg.key)throw 0;const r=await yt("commentThreads",{part:"snippet",videoId:v.id,maxResults:20,order:"relevance"});
   st[i].cm=r.items.map(x=>{const s=x.snippet.topLevelComment.snippet;return{n:s.authorDisplayName,t:s.textOriginal,a:"💬",w:s.likeCount+" likes"}})}
  catch(_){st[i].cm=[]}
  if(ci===i)renderC();
 }
}
function post(){const t=cinp.value.trim();if(!t)return;if(!st[ci].cm)st[ci].cm=[];st[ci].cm.unshift({n:"you",t,a:"🙂",w:"now"});st[ci].m++;cinp.value="";renderC();paint(ci);list.scrollTop=0}
$("post").onclick=post;cinp.addEventListener("keydown",e=>{if(e.key==="Enter")post()});
$("shX").onclick=closeS;$("setX").onclick=closeS;scrim.onclick=closeS;
const yt=(ep,p)=>fetch("https://www.googleapis.com/youtube/v3/"+ep+"?"+new URLSearchParams({...p,key:cfg.key})).then(r=>r.json()).then(j=>{if(j.error)throw new Error(j.error.message);return j},e=>{if(e instanceof Error&&e.message!=="Failed to fetch")throw e;throw new Error("the request was blocked or you’re offline. Open the downloaded file locally or host it yourself.")});
const secs=d=>{if(/H/.test(d))return 9999;const m=d.match(/PT(?:(\d+)M)?(?:(\d+)S)?/);return(+m[1]||0)*60+(+m[2]||0)};
async function load(more){
 if(busy)return;busy=true;
 const ids=[...new Set(cfg.links.split(/[\s,]+/).map(t=>{const m=t.match(/(?:shorts\/|v=|youtu\.be\/|embed\/)([\w-]{11})/)||t.match(/^([\w-]{11})$/);return m&&m[1]}).filter(Boolean))];
 if(!cfg.key&&!ids.length){if(!more){reset();add(DEMO);setStat("Showing demo clips. Add an API key or Shorts links, then load.")}busy=false;return}
 try{
  let L=ids;
  if(!ids.length){const r=await yt("search",{part:"snippet",type:"video",videoDuration:"short",videoEmbeddable:"true",q:cfg.q+" #shorts",maxResults:25,...(more&&next?{pageToken:next}:{})});next=r.nextPageToken||"";L=r.items.map(x=>x.id.videoId)}
  else next="";
  let out;
  if(cfg.key){const d=await yt("videos",{part:"snippet,statistics,contentDetails,status",id:L.join(",")});
   out=d.items.filter(x=>x.status.embeddable&&(ids.length||secs(x.contentDetails.duration)<=60)).map((x,k)=>({id:x.id,e:"▶️",c:PAL[(items.length+k)%6],u:x.snippet.channelTitle,cap:x.snippet.title,tags:"",l:+x.statistics.likeCount||0,m:+x.statistics.commentCount||0}))}
  else out=L.map((id,k)=>({id,e:"▶️",c:PAL[(items.length+k)%6],u:"YouTube",cap:"YouTube Short",tags:"",l:0,m:0}));
  if(!more)reset();
  add(out);setStat(out.length?"Loaded "+out.length+" videos.":"No embeddable Shorts found. Try another topic.");
 }catch(e){setStat("Couldn’t load: "+e.message);if(!items.length)add(DEMO)}
 busy=false;
}
function reset(){feed.innerHTML="";items=[];st=[];feed.scrollTop=0}
$("gear").onclick=()=>{$("fk").value=cfg.key;$("fq").value=cfg.q;$("fl").value=cfg.links;openS("set")};
$("fgo").onclick=()=>{cfg={key:$("fk").value.trim(),q:$("fq").value.trim()||"funny animals",links:$("fl").value};try{localStorage.setItem("scrolltok",JSON.stringify(cfg))}catch(_){}
 setStat("Loading…");load().then(()=>{if(items.length&&items[0].id)closeS()})};
$("mute").onclick=()=>{muted=!muted;cmd(muted?"mute":"unMute");$("mute").textContent=muted?"🔇":"🔊";toast(muted?"Sound off":"Sound on")};
const tF=$("tFol"),tY=$("tFyp");
tF.onclick=()=>{tF.classList.add("on");tY.classList.remove("on");toast("Follow creators to fill this feed")};
tY.onclick=()=>{tY.classList.add("on");tF.classList.remove("on")};
document.addEventListener("keydown",e=>{
 if(["INPUT","TEXTAREA"].includes(e.target.tagName))return;
 if(e.key==="ArrowDown"||e.key==="j")feed.children[Math.min(cur+1,items.length-1)].scrollIntoView({behavior:"smooth"});
 if(e.key==="ArrowUp"||e.key==="k")feed.children[Math.max(cur-1,0)].scrollIntoView({behavior:"smooth"});
 if(e.key==="l")like(cur);
 if(e.key==="Escape")closeS();
});
load();

</script>

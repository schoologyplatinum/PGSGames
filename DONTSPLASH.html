function tileTex(rep){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');g.fillStyle='#d8f1ee';g.fillRect(0,0,128,128);g.strokeStyle='#9fd0cc';g.lineWidth=4;g.strokeRect(0,0,128,128);g.fillStyle='#ffffff30';g.fillRect(6,6,50,50);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);return t}

const platT=mk(256,256,(g,w,h)=>{for(let i=0;i<4;i++)for(let j=0;j<4;j++){g.fillStyle=`hsl(${rnd(48,56)},${rnd(35,50)}%,${rnd(80,87)}%)`;g.fillRect(i*64,j*64,64,64);const gr=g.createLinearGradient(i*64,j*64,i*64+64,j*64+64);gr.addColorStop(0,'rgba(255,255,255,.25)');gr.addColorStop(1,'rgba(120,100,40,.12)');g.fillStyle=gr;g.fillRect(i*64,j*64,64,64)}stain(g,w,h,12,'rgba(120,105,50,',.3);speck(g,w,h,1800,'rgba(90,75,30,',.35);g.strokeStyle='rgba(125,115,80,.9)';g.lineWidth=3;for(let i=0;i<4;i++)for(let j=0;j<4;j++)g.strokeRect(i*64,j*64,64,64);for(let k=0;k<3;k++){g.strokeStyle='rgba(90,80,50,.4)';g.lineWidth=1;g.beginPath();let x=rnd(0,w),y=rnd(0,h);g.moveTo(x,y);for(let s=0;s<5;s++){x+=rnd(-10,10);y+=rnd(2,12);g.lineTo(x,y)}g.stroke()}},1.5,1.5);
const floorT=mk(256,256,(g,w,h)=>{for(let i=0;i<2;i++)for(let j=0;j<2;j++){g.fillStyle=`hsl(${rnd(105,125)},${rnd(30,40)}%,${rnd(30,38)}%)`;g.fillRect(i*128,j*128,128,128)}stain(g,w,h,8,'rgba(20,50,20,',.3);speck(g,w,h,1500,'rgba(0,0,0,',.3);g.strokeStyle='rgba(15,35,15,.85)';g.lineWidth=5;for(let i=0;i<2;i++)for(let j=0;j<2;j++)g.strokeRect(i*128,j*128,128,128)},10,275);
const woodT=mk(256,256,(g,w,h)=>{const cs=['#c9a26a','#bb9360','#d3ad76','#c19a64'];for(let i=0;i<4;i++){g.fillStyle=cs[i];g.fillRect(i*64,0,64,h);for(let k=0;k<14;k++){g.strokeStyle='rgba(95,58,25,'+rnd(.12,.3)+')';g.lineWidth=rnd(1,2);g.beginPath();const x=i*64+rnd(4,60);g.moveTo(x,0);for(let y=0;y<=h;y+=32)g.lineTo(x+Math.sin(y*.05+k)*2,y);g.stroke()}g.fillStyle='rgba(70,40,15,.55)';g.beginPath();g.ellipse(i*64+rnd(15,50),rnd(30,230),5,9,0,0,7);g.fill();g.fillStyle='rgba(40,22,8,.9)';g.fillRect(i*64,0,2,h)}speck(g,w,h,800,'rgba(60,35,15,',.3)},1,1);
const wt=mk(256,256,(g,w,h)=>{g.fillStyle='#5db35a';g.fillRect(0,0,w,h);stain(g,w,h,10,'rgba(20,90,40,',.4);for(let k=0;k<44;k++){g.strokeStyle=k%2?'rgba(230,255,210,.2)':'rgba(15,70,30,.22)';g.lineWidth=rnd(1,3);g.beginPath();const y=rnd(0,h);g.moveTo(0,y);for(let x=0;x<=w;x+=16)g.lineTo(x,y+Math.sin(x*.07+k)*5);g.stroke()}speck(g,w,h,600,'rgba(255,255,255,',.25)},10,275);
const ceilT=mk(256,256,(g,w,h)=>{g.fillStyle='#d3cdb8';g.fillRect(0,0,w,h);speck(g,w,h,1800,'rgba(80,70,50,',.3);g.strokeStyle='rgba(80,75,60,.7)';g.lineWidth=4;g.strokeRect(0,0,w,h);g.fillStyle='#fffbe6';g.fillRect(48,98,160,60);g.strokeStyle='#999';g.lineWidth=3;g.strokeRect(48,98,160,60)},2.5,69);

const box=(w,h,d,mat,x=0,y=0,z=0)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);return m};
const WATER=-.6,FLOOR=-1.6;
const water=new THREE.Mesh(new THREE.PlaneGeometry(40,1100),M(0xffffff,{map:wt,transparent:true,opacity:.9,shininess:40,specular:0xbbe8a0}));
water.rotation.x=-Math.PI/2;water.position.set(0,WATER,-500);S.add(water);
const pool=box(40,1,1100,M(0xffffff,{map:floorT}),0,FLOOR-.5,-500);S.add(pool);
for(const sx of[-1,1]){const w=box(1,16,1100,M(0xffffff,{map:wallT}),sx*20,6,-500);S.add(w);
 const pilM=M(0xffffff,{map:mk(512,512,wallFn,1,2)});for(let z=10;z>-1050;z-=14)S.add(box(2.4,16,2.4,pilM,sx*11,6,z))}
S.add(box(40,1,1100,new THREE.MeshBasicMaterial({map:ceilT}),0,14,-500));
const stoneT=mk(128,128,(g,w,h)=>{g.fillStyle='#8c8a84';g.fillRect(0,0,w,h);stain(g,w,h,18,'rgba(40,38,35,',.5);stain(g,w,h,12,'rgba(200,196,185,',.35);speck(g,w,h,1200,'rgba(30,28,25,',.5);speck(g,w,h,600,'rgba(235,230,215,',.5)},1,1);
const stoneM=M(0xffffff,{map:stoneT,shininess:35,specular:0x333333});
function peb(r){const gm=new THREE.IcosahedronGeometry(r,2),pos=gm.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i),n=1+.16*Math.sin(x*9/r*.3+y*3/r*.3)+.12*Math.sin(y*11/r*.3+z*7/r*.3)+.08*Math.sin(z*13/r*.3+x*5/r*.3);pos.setXYZ(i,x*n*1.15,y*n*.7,z*n)}gm.computeVertexNormals();return new THREE.Mesh(gm,stoneM)}
// ---------- player rig (Roblox style)
function face(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle='#f5cd30';g.fillRect(0,0,64,64);g.fillStyle='#000';g.fillRect(18,22,6,10);g.fillRect(40,22,6,10);g.lineWidth=4;g.strokeStyle='#000';g.beginPath();g.arc(32,34,13,.15*Math.PI,.85*Math.PI);g.stroke();return new THREE.CanvasTexture(c)}
const rig=new THREE.Group(),Y=M(0xf5cd30);
const head=box(1,1,1,[Y,Y,Y,Y,new THREE.MeshPhongMaterial({map:face()}),Y],0,3.7,0);
const torso=box(1.6,1.6,.8,M(0x0d69ac),0,2.4,0);
function limb(w,col,x,y){const g=new THREE.Group();g.position.set(x,y,0);g.add(box(w,1.6,.8,M(col),0,-.8,0));rig.add(g);return g}
const aL=limb(.8,0xf5cd30,-1.2,3.2),aR=limb(.8,0xf5cd30,1.2,3.2),lL=limb(.8,0xa4bd47,-.4,1.6),lR=limb(.8,0xa4bd47,.4,1.6);
rig.add(head,torso);const up=new THREE.Group();up.position.y=1.6;rig.add(up);[head,torso,aL,aR].forEach(o=>{up.add(o);o.position.y-=1.6});rig.rotation.order='YXZ';rig.scale.setScalar(.55);S.add(rig);const held=peb(.4);held.position.set(0,-1.8,.1);aR.add(held);
// ---------- monster
const mon=new THREE.Group(),fl=M(0x7a5238,{map:skinT,shininess:10}),fd=M(0x4a2f20,{map:skinT,shininess:6}),cl=M(0x1c0f0a);
const sph=(r,sx,sy,sz,m,x,y,z,p)=>{const o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);o.scale.set(sx,sy,sz);o.position.set(x,y,z);(p||mon).add(o);return o};
const cyl=(r1,r2,h,m,x,y,z,p)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,10),m);o.position.set(x,y,z);(p||mon).add(o);return o};
sph(1,1.5,1.9,1.1,fl,0,3.7,.2).rotation.x=.3;
for(const s of[-1,1]){cyl(.5,.38,2.6,fd,s*.8,1.3,0);sph(.45,1,.6,1.7,fd,s*.8,.1,.4);sph(.75,1,1,1,fl,s*1.45,5,.3)}
const hd=new THREE.Group();hd.position.set(0,6.2,.9);mon.add(hd);
sph(1,1.05,1.25,1.05,M(0x7a4a30,{map:skinT,shininess:25}),0,0,0,hd);
sph(.8,.95,1.1,.5,M(0x120605),0,0,.62,hd);
const rim=new THREE.Mesh(new THREE.TorusGeometry(.95,.1,8,28),M(0xe0701e,{emissive:0x8a3000}));rim.scale.set(1,1.2,1);rim.position.z=.55;hd.add(rim);
const ring=new THREE.Mesh(new THREE.TorusGeometry(.3,.09,8,20),M(0xe9dcc0));ring.position.set(0,0,.98);hd.add(ring);
sph(.17,1,1,1,M(0xff3a10,{emissive:0xcc2200}),0,0,.98,hd);hd.add(box(.07,2.4,.12,M(0x050202),0,0,1.03));
const mA=[-1,1].map(s=>{const g=new THREE.Group();g.position.set(s*1.8,5,.3);cyl(.32,.26,2.6,fd,0,-1.3,0,g);const e=new THREE.Group();e.position.y=-2.6;e.rotation.x=-.5;g.add(e);cyl(.26,.18,2.8,fd,0,-1.4,0,e);
 for(let i=-1;i<=2;i++){const c=cyl(.02,.09,2.2,cl,i*.16-.08,-3.9,0,e);c.rotation.set(Math.PI,0,i*.14-.07)}
 mon.add(g);return g});mon.scale.setScalar(.85);


S.add(mon);
// ---------- level
let lvl,plats,rows,pebs,exitP,pick=null,thr=null,proj=[],D=0,state='menu',P,Mo,rip=[],pc=3,keys={},yaw=0,pitch=.35,tAnim=0,msgT=0;
const DIF=[{n:'Easy',cnt:25,gap:3,sz:5,spd:18,hear:.9},{n:'Medium',cnt:35,gap:4,sz:4.5,spd:24,hear:1.2},{n:'Hard',cnt:48,gap:5,sz:4,spd:32,hear:1.5}];
function build(d){D=d;if(lvl)S.remove(lvl);lvl=new THREE.Group();S.add(lvl);plats=[];pebs=[];
 const tm=M(0xffffff,{map:platT,shininess:50,specular:0x555544});const add=(x,z,w,dd)=>{plats.push({x,z,w,d:dd});lvl.add(box(w,1.6,dd,tm,x,-.8,z))};
 add(0,0,10,10);const sz=DIF[d].sz;let z=-5-DIF[d].gap-sz/2,x=0;
 for(let i=0;i<DIF[d].cnt;i++){x=Math.max(-8,Math.min(8,x+(Math.random()*5-2.5)));add(x,z,sz,sz);
  if(i%3==1){const p=peb(.28);p.position.set(x+rnd(-1,1),.14,z+rnd(-1,1));p.rotation.set(rnd(0,6),rnd(0,6),rnd(0,6));lvl.add(p);pebs.push(p)}
  z-=sz+DIF[d].gap}
 const ez=z+sz/2-5;add(0,ez,10,10);rows=plats.slice(1).map((p,i)=>(plats[i].z-plats[i].d/2+p.z+p.d/2)/2);exitP={x:0,z:ez-3};
 const door=box(4,6,.5,M(0x33ff77,{emissive:0x22cc55}),0,3,ez-4.6);lvl.add(door);
 const l=new THREE.PointLight(0x55ff99,1,25);l.position.set(0,4,ez-2);lvl.add(l);
 P={x:0,y:0,z:2,vy:0,vx:0,vz:0,face:0,air:false,wt:0};Mo={x:15,z:-60,tx:15,tz:-60,alert:0,wx:15,wz:-60,t:0,h:0,path:[],pgk:''};
 pc=3;pick=thr=null;proj.forEach(o=>S.remove(o.m));proj=[];yaw=0;pitch=.35;rip.forEach(r=>S.remove(r.m));rip=[]}
function ripple(x,z,r){const m=new THREE.Mesh(new THREE.RingGeometry(.8,1,32),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,side:2}));m.rotation.x=-Math.PI/2;m.position.set(x,WATER+.05,z);S.add(m);rip.push({m,t:0,r:Math.min(r*.25,8)})}
function noise(x,z,r){ripple(x,z,r);const md=Math.hypot(Mo.x-x,Mo.z-z);if(md<r*DIF[D].hear){Mo.tx=x;Mo.tz=z;Mo.alert=5;Mo.v=Math.max(DIF[D].spd,md/[1.4,1,.8][D])}}
function onPlat(x,z,pad){for(const p of plats)if(Math.abs(x-p.x)<p.w/2+pad&&Math.abs(z-p.z)<p.d/2+pad)return p;return null}
// ---------- input
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyF')throwP();if(e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
let drag=0;addEventListener('pointerdown',e=>{if(e.target.id==='c')drag=1});addEventListener('pointerup',()=>drag=0);
addEventListener('pointermove',e=>{if(drag){yaw-=e.movementX*.006;pitch=Math.max(-.1,Math.min(1.2,pitch+e.movementY*.005))}});
function throwP(){if(state!=='play'||pc<1||thr||pick)return;thr={t:0,rel:false,tx:P.x-Math.sin(yaw)*20,tz:P.z-Math.cos(yaw)*20}}
function msg(t,ms=1800){$('msg').textContent=t;$('msg').style.opacity=1;msgT=ms}
function end(win){state='over';$('menu').style.display='flex';$('mt').innerHTML=win?'<b style="font-size:26px;color:#6dff9a">YOU ESCAPED!</b><br>Pick a difficulty to play again.':'<b style="font-size:26px;color:#ff6b6b">The monster got you.</b><br>Stay quiet and try again.'}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{build(+b.dataset.d);$('menu').style.display='none';state='play';msg('Cross the platforms. Don\'t splash!',2500)});
// ---------- loop
let last=performance.now();
function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;
 if(msgT>0){msgT-=dt*1000;if(msgT<=0)$('msg').style.opacity=0}
 if(state==='play')upd(dt);else if(P){yaw+=dt*.1}
 if(P){camUpd()}else{Cam.position.set(0,6,14);Cam.lookAt(0,2,-20)}
 wt.offset.set(n*.00002,-n*.00004);R.render(S,Cam)}
function upd(dt){
 if(keys.ArrowLeft)yaw+=dt*2;if(keys.ArrowRight)yaw-=dt*2;
 let ix=(keys.KeyD?1:0)-(keys.KeyA?1:0),iz=(keys.KeyW?1:0)-(keys.KeyS?1:0);const l=Math.hypot(ix,iz)||1;ix/=l;iz/=l;
 const inW=P.y<WATER,sp=inW?5:8,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
 const fr=pick?.1:thr?.4:1,tvx=(fx*iz+rx*ix)*sp*fr,tvz=(fz*iz+rz*ix)*sp*fr,k=Math.min(1,dt*(P.air?4:14));
 P.vx+=(tvx-P.vx)*k;P.vz+=(tvz-P.vz)*k;
 const prev=P.y,ox=P.x,oz=P.z;P.x=Math.max(-18,Math.min(18,P.x+P.vx*dt));P.z+=P.vz*dt;if(prev<-.02&&onPlat(P.x,P.z,.4)&&!onPlat(ox,oz,.4)){if(!onPlat(P.x,oz,.4)){P.z=oz;P.vz=0}else if(!onPlat(ox,P.z,.4)){P.x=ox;P.vx=0}else{P.x=ox;P.z=oz;P.vx=P.vz=0}}
 if(keys.Space&&!P.air){P.vy=11.5;P.air=true}
 P.vy-=30*dt;P.y+=P.vy*dt;P.air=true;
 const pl=onPlat(P.x,P.z,.4);
 if(pl&&P.vy<=0&&prev>=-.02&&P.y<=0){P.y=0;if(P.vy<-14)noise(P.x,P.z,5);P.sq=Math.min(.2,-P.vy*.012);P.vy=0;P.air=false}
 else if(P.y<=FLOOR){P.y=FLOOR;P.vy=0;P.air=false}
 if(prev>=WATER&&P.y<WATER&&!(pl&&P.y>-.05)){noise(P.x,P.z,120);msg('SPLASH!',900)}

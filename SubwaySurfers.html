 const h=rnd(0,360),tw=x.measureText(w).width;x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=5;x.shadowOffsetX=3;x.shadowOffsetY=4;x.lineWidth=size/8;x.strokeStyle='#111';x.strokeText(w,0,0);

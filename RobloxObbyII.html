  for(const a of ARCH)if(!a.d&&Math.abs(P.z-a.z)<1.5&&Math.abs(P.x-a.x)<5.5&&P.y>a.y-.5&&P.y<a.y+9){a.d=1;burst(a.x-5.5,a.y+10,a.z,90,1,26);burst(a.x+5.5,a.y+10,a.z,90,1,26);burst(a.x,a.y+10,a.z,140,10,20)}
  for(const s of N){if(!s.kill)continue;const p=s.m.position,c=Math.cos(s.m.rotation.y),n=Math.sin(s.m.rotation.y),dx=P.x-p.x,dz=P.z-p.z,lx=dx*c-dz*n,lz=dx*n+dz*c;
    if(Math.abs(lx)<s.hx+.8&&Math.abs(lz)<s.hz+.8&&P.y<p.y+s.hy&&P.y+5>p.y-s.hy){respawn();return}}

// confetti
const CN=1200,CQ=[],CF=new THREE.InstancedMesh(new THREE.PlaneGeometry(.6,.35),new THREE.MeshBasicMaterial({side:THREE.DoubleSide,fog:false}),CN),cd=new THREE.Object3D(),CL=[0xff3b6b,0xffd23f,0x35d07f,0x2fb4ff,0xb06bff,0xff8a2a,0xffffff].map(c=>new THREE.Color(c));
CF.frustumCulled=false;for(let i=0;i<CN;i++){CQ.push({l:0,p:new THREE.Vector3(),v:new THREE.Vector3(),r:new THREE.Vector3(),w:new THREE.Vector3()});CF.setColorAt(i,CL[i%7])}S.add(CF);
let ci=0;
function burst(x,y,z,n,sp,up){for(let i=0;i<n;i++){const j=ci=(ci+1)%CN,p=CQ[j],a=Math.random()*6.28,s=3+Math.random()*12;p.l=3+Math.random()*1.5;p.p.set(x+(Math.random()-.5)*sp,y,z+(Math.random()-.5)*sp);p.v.set(Math.cos(a)*s,up*(.5+Math.random()),Math.sin(a)*s);p.r.set(Math.random()*6,Math.random()*6,Math.random()*6);p.w.set(Math.random()*14-7,Math.random()*14-7,Math.random()*14-7);CF.setColorAt(j,CL[Math.random()*7|0])}CF.instanceColor.needsUpdate=true}
function confUpdate(dt){const dr=Math.exp(-dt*1.4),dv=Math.exp(-dt*.9);for(let i=0;i<CN;i++){const p=CQ[i];if(p.l>0){p.l-=dt;p.v.y-=24*dt;p.v.x*=dr;p.v.z*=dr;p.v.y*=dv;p.p.addScaledVector(p.v,dt);p.r.addScaledVector(p.w,dt);cd.position.copy(p.p);cd.rotation.set(p.r.x,p.r.y,p.r.z);const k=Math.min(1,p.l*2);cd.scale.set(k,k,k)}else cd.scale.set(0,0,0);cd.updateMatrix();CF.setMatrixAt(i,cd.matrix)}CF.instanceMatrix.needsUpdate=true}
// animation
const lerp=(a,b,k)=>a+(b-a)*k;
function animate(dt,m){
  const sp=Math.min(1,Math.hypot(P.vx,P.vz)/16),k=1-Math.exp(-dt*16);
  mv=lerp(mv,P.g?sp:0,1-Math.exp(-dt*12));air=lerp(air,P.g?0:1,1-Math.exp(-dt*14));
  ph+=dt*9*sp;const sw=Math.sin(ph)*.95*mv,id=Math.sin(T*2)*.04;
  const rise=P.vy>0?1:.6;
  LL.rotation.x=lerp(LL.rotation.x,sw*(1-air)+air*-.35*rise,k);RL.rotation.x=lerp(RL.rotation.x,-sw*(1-air)+air*.3,k);
  LA.rotation.x=lerp(LA.rotation.x,-sw*(1-air)+air*-2.7,k);RA.rotation.x=lerp(RA.rotation.x,sw*(1-air)+air*-2.7,k);
  LA.rotation.z=lerp(LA.rotation.z,-id-air*.35,k);RA.rotation.z=lerp(RA.rotation.z,id+air*.35,k);
  if(sp>.05){const ty=Math.atan2(P.vx,P.vz);let d=ty-P.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));P.yaw+=d*(1-Math.exp(-dt*14));turn=lerp(turn,d,k)}else turn=lerp(turn,0,k);
  AV.rotation.y=P.yaw;A.rotation.x=lerp(A.rotation.x,mv*.1,k);A.rotation.z=lerp(A.rotation.z,-Math.max(-.6,Math.min(.6,turn))*.22*mv,k);
  A.position.y=Math.abs(Math.sin(ph))*.18*mv;head.rotation.y=lerp(head.rotation.y,-Math.max(-.5,Math.min(.5,turn))*.5,k);
  AV.position.set(P.x,P.y,P.z)}

let last=performance.now();
(function loop(now){requestAnimationFrame(loop);let dt=Math.min(.033,(now-last)/1000);last=now;T+=dt;
  if(playing){if(K.ArrowLeft)cy+=dt*2;if(K.ArrowRight)cy-=dt*2;
    for(let i=0;i<2;i++)phys(dt/2)}
